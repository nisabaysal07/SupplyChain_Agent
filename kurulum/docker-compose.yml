name: docker_supply
services:
  postgres:
    image: postgres:17
    container_name: proje_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # İlk başlatmada şema + veri otomatik yüklenir (bkz. init_db.sh)
      - ../db:/supply_db:ro
      - ./init_db.sh:/docker-entrypoint-initdb.d/init_db.sh:ro
    healthcheck:
      # -h 127.0.0.1: ilk yükleme sürerken (sunucu henüz TCP'yi dinlemiyor) healthy görünmesin
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: proje_qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    ports:
      - "6333:6333"   # REST API + web arayüzü
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data: